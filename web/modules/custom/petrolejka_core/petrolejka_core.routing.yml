petrolejka_core.front:
  path: '/uvod'
  defaults:
    _controller: '\Drupal\petrolejka_core\Controller\FrontController::build'
    _title: 'Petrolejka'
  requirements:
    _permission: 'access content'

petrolejka_core.podcast_feed:
  path: '/podcast/feed.xml'
  defaults:
    _controller: '\Drupal\petrolejka_core\Controller\PodcastFeedController::feed'
  requirements:
    _permission: 'access content'

petrolejka_core.podcast_settings:
  path: '/admin/config/media/podcast'
  defaults:
    _form: '\Drupal\petrolejka_core\Form\PodcastSettingsForm'
    _title: 'Podcast'
  requirements:
    _permission: 'administer petrolejka podcast'

petrolejka_core.donation_settings:
  path: '/admin/config/services/darovanie'
  defaults:
    _form: '\Drupal\petrolejka_core\Form\DonationSettingsForm'
    _title: 'Darovanie (PAY by square)'
  requirements:
    _permission: 'administer petrolejka donation'
