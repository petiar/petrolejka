name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kľúč
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Server si kód stiahne z GitHubu cez vlastný read-only deploy key.
      - name: Deploy na server
        run: |
          ssh -i ~/.ssh/deploy -p 29170 uid6682083@shell.r6.websupport.sk "
            set -e
            cd petrolejka.sk
            git fetch --prune origin
            git reset --hard origin/main
            composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
            vendor/bin/drush deploy -y
          "
